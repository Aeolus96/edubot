slam_toolbox:
  ros__parameters:
    # Time
    use_sim_time: false

    # Mode
    mode: mapping # mapping or localization

    # Plugin params
    # solver_plugin: solver_plugins::CeresSolver
    # ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    # ceres_preconditioner: SCHUR_JACOBI
    # ceres_trust_strategy: LEVENBERG_MARQUARDT
    # ceres_dogleg_type: TRADITIONAL_DOGLEG
    # ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    restamp_tf: false # use scan header stamp for tf timestamps
    scan_queue_size: 1 # should be 1 in async mode

    # use_map_saver: true
    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    # map_file_name: test_map
    # map_start_pose: [0.0, 0.0, 0.0]
    # map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 # if 0 never publishes odometry
    map_update_interval: 0.5
    enable_interactive_mode: false

    # Map parameters
    resolution: 0.05
    min_laser_range: 0.0
    max_laser_range: 20.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 10.0

    # General Parameters
    minimum_travel_distance: 0.05
    use_scan_matching: true
    use_scan_barycenter: false
    minimum_travel_heading: 0.052

    scan_buffer_size: 60
    scan_buffer_maximum_scan_distance: 6.0
    link_match_minimum_response_fine: 0.6
    link_scan_maximum_distance: 6.0

    # # Loop closure window and thresholds
    loop_search_maximum_distance: 5.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 0.16
    loop_match_minimum_response_coarse: 0.7
    loop_match_minimum_response_fine: 0.5

    # # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.02
    correlation_search_space_smear_deviation: 0.05

    # # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 6.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.05

    # # Scan Matcher Parameters
    distance_variance_penalty: 1.0
    angle_variance_penalty: 2.0

    fine_search_angle_offset: 0.01
    coarse_search_angle_offset: 0.35
    coarse_angle_resolution: 0.017
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 3
    occupancy_threshold: 0.25
